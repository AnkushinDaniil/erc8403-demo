<!doctype html><meta charset=utf-8><title>Account 0x…cafe8403 · local explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:18px "DejaVu Sans",sans-serif;padding:22px 26px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#8b949e;font-size:15px;margin-bottom:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 18px;margin-bottom:14px}
.lab{color:#8b949e;font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.mono{font-family:"DejaVu Sans Mono",monospace}
#root{font-size:19px;word-break:break-all;line-height:1.35;border-radius:8px;padding:4px 6px;margin:-4px -6px}
.flash{animation:fl 1.6s ease-out}@keyframes fl{0%{background:#d29922;color:#000}100%{background:transparent}}
.row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid #21262d;font-size:17px}.row:first-of-type{border-top:0}
.k{color:#7ee787}.bal{font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid .card{margin:0}.big{font-size:24px;font-weight:bold;margin-top:2px}
#sync{position:fixed;right:0;bottom:0;width:24px;height:24px;background:#000}
.tx{font-size:15px;color:#8b949e}.ok{color:#7ee787}
</style>
<h1>Account <span class=mono>0x00000000…CAfE8403</span></h1>
<div class=sub>local Nethermind node · chain 81410 · block <b id=blk>…</b> · read live over JSON-RPC</div>
<div class=card><div class=lab>Storage slot 0 · committed root</div><div id=root class=mono>…</div></div>
<div class=card><div class=lab>Key records in account storage · <span id=n></span></div><div id=keys></div></div>
<div class=grid>
<div class=card><div class=lab>Alice</div><div class="big mono" id=ba>…</div></div>
<div class=card><div class=lab>Bob</div><div class="big mono" id=bb>…</div></div>
<div class=card><div class=lab>Thief</div><div class="big mono" id=bt>…</div></div>
</div>
<div id=sync></div>
<script>
const A='0x00000000000000000000000000000000cafe8403',BOB='0x0000000000000000000000000000000000000b0b',TH='0x0000000000000000000000000000000000000bad';
const NAMES={'70997970c51812dc3a010c7d01b50e0d17dc79c8':'laptop','3c44cdddb6a900fa2b585dd299e03d12fa4293bc':'phone','15d34aaf54267db7d7c367839aaf71a00a2c6a65':'vault'};
let id=0;async function rpc(m,p){const r=await fetch('/rpc',{method:'POST',body:JSON.stringify({jsonrpc:'2.0',id:++id,method:m,params:p})});return (await r.json()).result}
const st=i=>rpc('eth_getStorageAt',[A,'0x'+i.toString(16),'latest']);
const eth=async a=>(Number(BigInt(await rpc('eth_getBalance',[a,'latest']))/10n**14n)/1e4).toFixed(2)+' ETH';
let last='';
async function tick(){try{
  const root=await st(0);const n=parseInt(await st(1),16);let h='';
  for(let i=0;i<n;i++){const a=(await st(0x101+2*i)).slice(26);h+=`<div class=row><span class="mono">0x${a.slice(0,6)}…${a.slice(-6)}</span><span class=k>${NAMES[a]||''}</span></div>`}
  const e=document.getElementById('root');
  if(root!==last){e.textContent=root;if(last){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}last=root;window.rootChanged=Date.now()}
  document.getElementById('keys').innerHTML=h;document.getElementById('n').textContent=n+' key'+(n==1?'':'s');
  document.getElementById('blk').textContent=parseInt(await rpc('eth_blockNumber',[]),16);
  document.getElementById('ba').textContent=await eth(A);document.getElementById('bb').textContent=await eth(BOB);document.getElementById('bt').textContent=await eth(TH);
}catch(e){}setTimeout(tick,250)}
tick();window.sync=v=>document.getElementById('sync').style.background=v?'#fff':'#000';
</script>
