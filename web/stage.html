<!doctype html><meta charset=utf-8>
<style>

</style>
<svg id=s width=1080 height=1080 viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id=sub></div>
<script>
const C={bg:'#0d1117',card:'#161b22',line:'#30363d',tx:'#e6edf3',dim:'#8b949e',g:'#56d364',r:'#f85149',a:'#f0b429',b:'#58a6ff',p:'#bc8cff'};
const cl=x=>Math.max(0,Math.min(1,x)),ez=u=>{u=cl(u);return u*u*(3-2*u)},K=(t,a,d)=>ez((t-a)/d),lp=(a,b,u)=>a+(b-a)*u;
const win=(t,a,b,f=0.3)=>Math.min(K(t,a,f),1-K(t,b-f,f));
const fl=(t,a,d=1.4)=>t>=a?Math.max(0,1-(t-a)/d):0;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function A(o){let s='';for(const k in o)if(o[k]!==undefined)s+=` ${k}="${o[k]}"`;return s}
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"${A({rx:o.rx??12,fill:o.fill??C.card,stroke:o.stroke??C.line,'stroke-width':o.sw??2,opacity:o.op,'stroke-dasharray':o.dash,transform:o.tf})}/>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}"${A({'font-size':o.size??22,fill:o.fill??C.tx,'text-anchor':o.anchor??'middle','font-weight':o.bold?'bold':undefined,'font-family':o.mono?'DejaVu Sans Mono':'DejaVu Sans',opacity:o.op,'letter-spacing':o.ls,transform:o.tf,'text-decoration':o.strike?'line-through':undefined})}>${esc(s)}</text>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${A({stroke:o.stroke??C.line,'stroke-width':o.sw??3,opacity:o.op,'stroke-dasharray':o.dash,'stroke-linecap':'round'})}/>`;
const G=(inner,o={})=>`<g${A({opacity:o.op,transform:o.tf})}>${inner}</g>`;
const mix=(c1,c2,u)=>{const h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=h(c1),b=h(c2);return '#'+a.map((v,i)=>Math.round(lp(v,b[i],cl(u))).toString(16).padStart(2,'0')).join('')};
const sh=h=>'0x'+h.slice(0,6)+'…'+h.slice(-6);
function pill(x,y,label,col,op=1,w=0){w=w||label.length*11+26;return G(R(x-w/2,y-17,w,34,{rx:17,fill:col,stroke:col})+T(x,y+7,label,{size:18,fill:'#0d1117',bold:1}),{op})}
function path(pts,u){u=cl(u);const n=pts.length-1,i=Math.min(n-1,Math.floor(u*n)),f=ez(u*n-i);return [lp(pts[i][0],pts[i+1][0],f),lp(pts[i][1],pts[i+1][1],f)]}
function mark(x,y,ok,s=1,op=1){const col=ok?C.g:C.r;const d=ok?'M-13,1 L-4,10 L14,-10':'M-11,-11 L11,11 M11,-11 L-11,11';return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><circle r="26" fill="${col}" opacity="0.16"/><circle r="26" fill="none" stroke="${col}" stroke-width="3"/><path d="${d}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`}
function keyicon(x,y,col,s=1){return `<g transform="translate(${x},${y}) scale(${s})" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"><circle cx="-26" cy="0" r="17"/><path d="M-9,0 L42,0 M28,0 L28,15 M42,0 L42,11"/></g>`}
let TL;
const W=(k,w,n=0)=>{const a=TL.words[k].filter(x=>x[1]===w);return a.length?a[Math.min(n,a.length-1)][0]:TL.starts[k]};

function subs(t){
  const el=document.getElementById('sub');let c=null;
  for(const s of TL.subs){if(t>=s.t0&&t<s.t1){c=s;break}}
  if(!c){el.innerHTML='';return}
  let cur=-1;c.words.forEach((w,i)=>{if(t>=w[0]-0.03)cur=i});
  const lineEnd=TL.starts[c.line]+TL.durs[c.line];
  el.innerHTML=c.words.map((w,i)=>`<span class="${i<cur?'d':i==cur?(t<=Math.max(w[1],w[0]+0.28)+0.1?'c':'d'):'f'}">${esc(w[2])}</span>`).join('');
}

function tree(x0,y0,o){
  let s='';const cx=x0+155,ry=y0,ly=y0+92;
  const xs=[x0+52,x0+155,x0+258];
  o.leaves.forEach((lf,i)=>{if(lf.op<=0)return;s+=L(xs[i],ly,cx,ry+40,{stroke:lf.dead?C.r:C.line,op:lf.op*(lf.dead?0.35:1),dash:lf.dead?'6 7':undefined})});
  s+=R(cx-112,ry,224,40,{rx:10,fill:mix(C.card,C.a,o.flash*0.3),stroke:mix(C.a,'#ffffff',o.flash*0.7),sw:2+o.flash*3});
  s+=T(cx,ry+27,'root '+o.root,{size:18,mono:1,fill:mix(C.a,'#ffffff',o.flash),bold:1});
  o.leaves.forEach((lf,i)=>{if(lf.op<=0)return;const col=lf.dead?C.r:lf.warn?C.a:lf.hot?C.g:C.line;const sc=lp(0.6,1,ez(lf.op));
    s+=G(R(-48,0,96,38,{rx:10,fill:mix(C.card,C.g,(lf.pop||0)*0.7),stroke:col,sw:lf.hot||lf.warn||lf.dead?3:2,dash:lf.dead?'5 5':undefined})+T(0,26,lf.name,{size:18,fill:lf.dead?C.r:C.tx,strike:lf.dead})+(lf.tag?T(0,58,lf.tag,{size:14,fill:lf.dead?C.r:C.a,bold:1,ls:1}):''),{tf:`translate(${xs[i]},${ly}) scale(${sc})`,op:lf.op*(lf.dead?0.8:1)})});
  return {svg:s,xs,ly,cx,ry};
}

function band(u){
  const c=TL.cmd,b=TL.beats;let s='';
  s+=R(0,720,1080,360,{rx:0,fill:'#0a0e14',stroke:'none'})+L(0,721,1080,721,{stroke:'#21262d',sw:2});
  const hd=(x,t)=>T(x,752,t,{size:14,fill:C.dim,anchor:'start',ls:1.5});
  s+=hd(22,"ALICE'S WALLET · OFF CHAIN")+hd(372,'ACCOUNT 0x…cafe8403 · ON CHAIN')+hd(702,'NODE')+hd(902,'BALANCES');
  let root=TL.roots[0],rt=-9;for(const r of TL.roots)if(u>=r.t){root=r;rt=r.t}
  const rf=rt>1?fl(u,rt):0;
  const lost=u>=c.a5.done&&u<c.a7.done,ghost=u>=c.a5.done?(u<c.a7.done?K(u,c.a5.done,0.4):1-K(u,c.a7.done,0.4)):0;
  const sending=(k,name)=>u>=c[k].start&&u<c[k].done+0.6;
  const leaves=[
    {name:'laptop',op:1,dead:u>=c.a4.done,warn:u>=b.l4+1.5&&u<c.a4.done,tag:u>=c.a4.done?'REVOKED':u>=b.l4+1.5?'STOLEN':'',hot:sending('a2')},
    {name:'vault',op:1},
    {name:'phone',op:K(u,c.a2.done,0.45),pop:fl(u,c.a2.done,1.6),hot:sending('a3')||sending('a4')||sending('a8')}];
  const tr=tree(20,775,{root:root.root.slice(0,6)+'…',flash:rf,leaves});
  s+=G(tr.svg,{op:1-ghost*0.82});
  if(lost)s+=G(R(20,948,330,40,{rx:20,fill:'#2a1215',stroke:C.r})+T(185,975,'local copy of the tree deleted',{size:17,fill:C.r,bold:1}),{op:K(u,c.a5.done,0.4)});
  const rec=fl(u,c.a7.done,1.6);if(rec>0)s+=R(8,764,326,182,{rx:14,fill:'none',stroke:C.g,sw:4,op:rec});
  // account
  s+=R(370,768,300,150,{stroke:mix(C.line,C.a,rf)});
  s+=T(390,798,'committed root · storage slot 0',{size:15,fill:C.dim,anchor:'start'});
  s+=R(386,808,268,46,{rx:9,fill:mix('#0d1117',C.a,rf*0.3),stroke:mix(C.a,'#ffffff',rf*0.7),sw:2+rf*3});
  s+=T(520,839,sh(root.root),{size:22,mono:1,bold:1,fill:mix(C.a,'#ffffff',rf)});
  s+=T(390,880,root.keys.length+' key records in storage',{size:15,fill:C.dim,anchor:'start'});
  s+=T(390,904,root.keys.join(' · '),{size:16,fill:C.g,anchor:'start'});
  // node
  s+=R(700,768,170,150,{});
  s+=T(785,798,'Nethermind',{size:18,bold:1});
  s+=T(785,818,'runs the account check',{size:12.5,fill:C.dim});
  const res=[['a2',1,'new root stored'],['a3',1,'key is in the tree'],['a4',1,'new root stored'],['t1',0,'proof ≠ current root'],['t2',0,'key not in this tree'],['t3',0,'signature ≠ this tx'],['a8',1,'key is in the tree']];
  let last=null;for(const q of res)if(u>=c[q[0]].done)last=q;
  if(last){const t0=c[last[0]].done,o=Math.min(1,(u-t0)/0.15)*(1-K(u,t0+4.4,0.6)),sc=1+fl(u,t0,0.35)*0.5,shk=last[1]?0:Math.sin((u-t0)*46)*8*fl(u,t0,0.5);
    s+=mark(785+shk,856,last[1],sc*0.82,o)+T(785,905,last[2],{size:12.5,fill:last[1]?C.g:C.r,bold:1,op:o})+(o<=0.01?T(785,862,'waiting…',{size:15,fill:C.dim}):'')}
  else s+=T(785,862,'waiting…',{size:15,fill:C.dim});
  // balances
  const bob=u>=c.a8.done+0.5?2:u>=c.a3.done+0.5?1:0;const bf=Math.max(fl(u,c.a3.done+0.5,1.2),fl(u,c.a8.done+0.5,1.2));
  s+=R(900,768,160,68,{stroke:mix(C.line,C.g,bf),fill:mix(C.card,C.g,bf*0.35)})+T(916,792,'Bob',{size:15,fill:C.dim,anchor:'start'})+T(916,822,bob.toFixed(2)+' ETH',{size:21,mono:1,bold:1,anchor:'start'});
  const tfz=Math.max(fl(u,c.t1.done,1.2),fl(u,c.t2.done,1.2),fl(u,c.t3.done,1.2));
  s+=R(900,850,160,68,{stroke:mix(C.line,C.r,tfz)})+T(916,874,'Thief',{size:15,fill:C.dim,anchor:'start'})+T(916,904,'0.00 ETH',{size:21,mono:1,bold:1,anchor:'start',fill:mix(C.tx,C.r,tfz)});
  // arrows
  s+=L(342,843,366,843,{stroke:'#3d444d'})+L(672,843,698,843,{stroke:'#3d444d'})+L(872,802,898,802,{stroke:'#3d444d'});
  // attacker lane
  const at=[[b.l5,b.l6,'stolen laptop key + proof for the old root'],[b.l6,b.l7,'a key from another account + its proof'],[b.l7,b.l8,"Alice's real signature, recipient changed"]];
  const ao=Math.min(K(u,b.l5,0.4),1-K(u,b.l8-0.2,0.4));
  if(ao>0){let lab=at[0][2];for(const q of at)if(u>=q[0])lab=q[2];
    s+=G(R(20,948,560,40,{rx:20,fill:'#2a1215',stroke:C.r})+T(44,975,'THIEF',{size:17,fill:C.r,bold:1,anchor:'start',ls:1})+T(118,975,lab,{size:17,anchor:'start'}),{op:ao})}
  // pills
  const dot=(x,y,col)=>{s+=`<circle cx="${x}" cy="${y}" r="17" fill="${col}" opacity="0.25"/><circle cx="${x}" cy="${y}" r="10" fill="${col}"/>`};
  const fly=(k,thief,col,ok,pay)=>{const q=c[k];const t0=q.typed-0.3,t1=q.done;if(u<t0)return;
    if(u<=t1){const f=(u-t0)/(t1-t0);
      if(f<0.38){const e=ez(f/0.38);thief?dot(470,lp(946,922,e),col):dot(lp(336,366,e),843,col)}
      else if(f<0.66){s+=R(370,768,300,150,{fill:'none',stroke:col,sw:5,op:1-Math.abs((f-0.52)/0.14)})}
      else{dot(lp(674,696,ez((f-0.66)/0.34)),843,col)}}
    else if(ok&&pay&&u<t1+0.5)dot(lp(874,894,ez((u-t1)/0.5)),802,col)};
  fly('a2',0,C.g,1);fly('a3',0,C.g,1,1);fly('a4',0,C.g,1);fly('t1',1,C.r,0);fly('t2',1,C.r,0);fly('t3',1,C.r,0);fly('a8',0,C.g,1,1);
  if(u>=c.a7.typed&&u<c.a7.done){const f=((u-c.a7.typed)/0.45)%1;dot(lp(366,336,ez(f)),843,C.b)}
  // status
  const st=[[0,'2 keys in the wallet  →  1 hash in the account',C.tx],[c.a2.start,'laptop signs: add the phone key',C.tx],[c.a2.done,'root changed · address unchanged',C.g],[c.a3.start,'phone signs and proves its key is in the tree',C.tx],[c.a3.done,'accepted · 1 ETH → Bob',C.g],
    [b.l4+1.5,'the laptop is stolen',C.a],[c.a4.start,'phone signs: revoke the laptop key',C.tx],[c.a4.done,'laptop revoked · new root',C.g],
    [c.t1.start,'attack 1 · stolen key + a proof for the old root',C.r],[c.t1.done,'refused · the proof does not match the current root',C.r],
    [c.t2.start,'attack 2 · a key that is valid in another account',C.r],[c.t2.done,"refused · that key is not in Alice's tree",C.r],
    [c.t3.start,'attack 3 · copy a real signature, change the recipient',C.r],[c.t3.done,'refused · the signature covers a different transaction',C.r],
    [c.a5.done,'the wallet lost its copy of the tree',C.a],[c.a6.done,'no tree → no proof → cannot pay',C.a],[c.a7.typed,'rebuild the tree from account storage',C.b],[c.a7.done,'rebuilt root = on-chain root · restored',C.g],[c.a8.done,'accepted · 1 ETH → Bob',C.g]];
  let cur=st[0];for(const q of st)if(u>=q[0])cur=q;
  const so=1;
  s+=R(20,1004,1040,56,{rx:12,fill:'#11161d',stroke:mix('#21262d',cur[2],0.55)})+`<circle cx="46" cy="1032" r="7" fill="${cur[2]}"/>`+T(68,1040,cur[1],{size:23,anchor:'start',fill:cur[2],bold:1,op:so});
  return s;
}


function band2(u){
  const c=TL.cmd,b=TL.beats,Q=TL.two;let s='';
  s+=R(0,720,1080,360,{rx:0,fill:'#0a0e14',stroke:'none'})+L(0,721,1080,721,{stroke:'#21262d',sw:2});
  const hd=(x,t)=>T(x,752,t,{size:14,fill:C.dim,anchor:'start',ls:1.5});
  s+=hd(22,'HOME CHAIN · KEYS LIVE HERE')+hd(318,'RELAY · ANYONE')+hd(522,'CHAIN TWO · NO KEYS STORED')+hd(872,'ON CHAIN TWO');
  let q=Q[0],qn=null;for(let i=0;i<Q.length;i++)if(u>=Q[i].t){q=Q[i];qn=Q[i+1]||null}
  const home=Math.min(q.home+Math.max(0,Math.floor(u-q.t+0.6)),qn?qn.home:1e9);
  let root=TL.roots[0],rt=-9;for(const r of TL.roots)if(u>=r.t){root=r;rt=r.t}
  const rf=rt>b.m1?fl(u,rt):0;
  const H1=Q.find(x=>x.sv>0).sv,WIN=TL.window;
  const ev=[['b1',1,'sv dy','checked the seal · stored @'+H1,C.g],['b2',1,'sv','phone key is in root @'+H1,C.g],['b4',1,'sv dy','seal ok · stored the newer root',C.g],
    ['u1',0,'sv','seal is not from the home signer',C.r],['u2',0,'sv','proof is for @'+H1+' · not the newest',C.r],['u3',2,'dy','@'+H1+' is inside the window',C.a],['b5',1,'sv dy','stored a newer root',C.g],['u4',0,'dy','@'+H1+' left the window',C.r]];
  let last=null;for(const e of ev)if(c[e[0]]&&u>=c[e[0]].done)last=e;
  let nx=1e9;for(const e of ev)if(c[e[0]]&&c[e[0]].start>(last?c[last[0]].done:1e9))nx=Math.min(nx,c[e[0]].start);
  const lo=last?Math.min(1,(u-c[last[0]].done)/0.15)*(1-K(u,Math.min(c[last[0]].done+4.6,nx-0.5,last[0]=='b2'?b.m4-0.6:1e9),0.5)):0;
  const hit=k=>last&&last[2].includes(k)?lo:0;
  s+=R(20,768,270,150,{stroke:mix(C.line,C.a,rf)});
  s+=T(36,794,"Alice's account · root",{size:14,fill:C.dim,anchor:'start'});
  s+=R(34,804,242,40,{rx:9,fill:mix('#0d1117',C.a,rf*0.3),stroke:mix(C.a,'#ffffff',rf*0.7),sw:2+rf*3});
  s+=T(155,831,sh(root.root),{size:18,mono:1,bold:1,fill:mix(C.a,'#ffffff',rf)});
  s+=T(36,872,'keys  '+root.keys.join(' · '),{size:16,fill:C.g,anchor:'start'});
  s+=T(36,902,'home block #'+home,{size:15,fill:C.dim,anchor:'start',mono:1});
  s+=L(294,843,514,843,{stroke:'#3d444d'});
  s+=R(318,810,172,66,{rx:10,fill:'#11161d'})+T(404,837,'signed block',{size:15})+T(404,860,'+ storage proof',{size:15,fill:C.dim});
  const box=(y,k,name,tier,h,sub)=>{const o=hit(k),col=last?last[4]:C.line;let a='';
    a+=R(520,y,330,70,{stroke:mix(C.line,col,o),sw:2+o*2,fill:mix(C.card,col,o*0.14)});
    a+=T(536,y+25,name,{size:17,bold:1,anchor:'start'})+T(536+name.length*10.6+10,y+25,tier,{size:13,fill:C.a,anchor:'start'});
    a+=T(836,y+26,h?'@'+h:'none yet',{size:17,mono:1,bold:1,fill:h?C.a:C.dim,anchor:'end'});
    return a};
  s+=box(768,'sv','savings','tier 2',q.sv);
  s+=T(536,820,hit('sv')>0.05?(last[1]==1?'✓ ':last[1]==2?'! ':'✗ ')+last[3]:'accepts the newest home root only',{size:13.5,fill:hit('sv')>0.05?last[4]:C.dim,anchor:'start',bold:hit('sv')>0.05?1:undefined});
  s+=box(848,'dy','daily','tier 1',q.dy).replace(/y="873"/g,'y="871"').replace(/y="874"/g,'y="872"');
  if(hit('dy')>0.05&&!last[2].includes('sv'))s+=T(536,898,(last[1]==1?'✓ ':last[1]==2?'! ':'✗ ')+last[3],{size:13.5,fill:last[4],anchor:'start',bold:1});
  else if(q.dy){const x0=536,x1=836,lo_=q.dy-WIN+1,px=v=>x0+(x1-x0)*(v-lo_)/(WIN-1);const inside=H1>=lo_;
    s+=T(536,894,'accepts @'+Math.max(1,lo_)+' … @'+q.dy,{size:13,fill:C.dim,anchor:'start'});
    s+=R(x0,902,x1-x0,8,{rx:4,fill:'#11161d',stroke:'#30363d',sw:1});
    const mx=Math.max(x0+6,Math.min(x1-6,px(H1)));
    s+=`<circle cx="${mx}" cy="906" r="6" fill="${inside?C.a:C.r}"/>`+T(836,894,(inside?'@'+H1+' inside':'@'+H1+' outside'),{size:13,fill:inside?C.a:C.r,anchor:'end',bold:1})}
  else s+=T(536,900,'accepts any root of the last '+WIN+' home blocks',{size:13.5,fill:C.dim,anchor:'start'});
  const bf=fl(u,c.b2.done,1.2),tf=c.u3?fl(u,c.u3.done,1.6):0,stolen=q.thief>1;
  s+=R(870,768,190,70,{stroke:mix(C.line,C.g,bf),fill:mix(C.card,C.g,bf*0.35)})+T(886,792,'Bob',{size:15,fill:C.dim,anchor:'start'})+T(886,824,q.bob.toFixed(2)+' ETH',{size:21,mono:1,bold:1,anchor:'start'});
  s+=R(870,848,190,70,{stroke:stolen?C.r:C.line,fill:mix(C.card,C.r,tf*0.4),sw:stolen?3:2})+T(886,872,'Thief',{size:15,fill:C.dim,anchor:'start'})+T(886,904,q.thief.toFixed(2)+' ETH',{size:21,mono:1,bold:1,anchor:'start',fill:stolen?C.r:C.tx});
  const dot=(x,y,col)=>{s+=`<circle cx="${x}" cy="${y}" r="17" fill="${col}" opacity="0.25"/><circle cx="${x}" cy="${y}" r="10" fill="${col}"/>`};
  const relay=k=>{const z=c[k];if(!z||u<z.typed||u>z.done)return;const f=(u-z.typed)/(z.done-z.typed);
    if(f<0.6)dot(lp(296,512,ez(f/0.6)),843,C.g);else{const e=ez((f-0.6)/0.4);dot(lp(505,514,e),lp(843,803,e),C.g);dot(lp(505,514,e),lp(843,883,e),C.g)}};
  relay('b1');relay('b4');relay('b5');
  const hitdot=(k,y,col)=>{const z=c[k];if(!z||u<z.typed-0.3||u>z.done)return;const f=(u-z.typed+0.3)/(z.done-z.typed+0.3);dot(680,lp(946,y,ez(f)),col)};
